<div class="media-block">
    <video class="fit-media" muted loop controls src={{ index .Params 1 }}></video>

    <div class="media-copy centered">
        <p>{{ index .Params 0 }}</p>

        {{ if isset .Params 2 }}
        <a class="action-link secondary-action" target="_blank" rel="noreferrer noopener" href={{ index .Params 2 }}>{{ index .Params 3 }}</a>
        {{ end }}
    </div>
</div>
