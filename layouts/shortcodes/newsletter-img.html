<div class="media-block centered">
    {{ if isset .Params 2 }}
    <a target="_blank" rel="noreferrer noopener" href={{ index .Params 2 }}>
        <img src={{ index .Params 1 }} class="media-image" alt="{{ index .Params 0 | plainify }}">
    </a>
    {{ else }}
    <img src={{ index .Params 1 }} class="media-image" alt="{{ index .Params 0 | plainify }}">
    {{ end }}

    <div class="media-copy">
        <p>{{ index .Params 0 }}</p>

        {{ if isset .Params 2 }}
        <a class="action-link secondary-action" target="_blank" rel="noreferrer noopener" href={{ index .Params 2 }}>{{ index .Params 3 }}</a>
        {{ end }}
    </div>
</div>
