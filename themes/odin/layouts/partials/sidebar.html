<nav class="section-sidebar" aria-label="{{ humanize .Section }} pages">
    <div class="section-sidebar-inner">
        <ul class="section-menu">
            {{ $currentPage := . }}
            {{ range where .Site.RegularPages "Section" .Section }}
                {{ $active := eq $currentPage.RelPermalink .RelPermalink }}
                <li>
                    <a
                        href="{{ .RelPermalink }}"
                        {{ if $active }}aria-current="page"{{ end }}
                    >{{ .LinkTitle }}</a>
                </li>
            {{ end }}
        </ul>
    </div>
</nav>
